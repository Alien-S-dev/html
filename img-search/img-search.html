<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻找图源</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #fffaf0;
        }
        h1{
            text-align: center;
            margin: 30px 0;
            font-size: 3rem;
            color: #333;
        }
        .main-box{
            display: flex;
            width: 90%;
            max-width: 1200px;
            height: 800px;
            background-color: #ffeac1;
            border: 2px solid #504134;
            margin: 0 auto;
        }
        .upload-side,.result-side{
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .upload-side{
            border-right: 2px solid #504134;
            gap: 20px;
        }
        .img-label{
            text-align: center;
            cursor: pointer;
        }
        .upload-icon{
            width: 100px;
            margin-bottom: 10px;
        }
        #user-img{
            max-width: 80%;
            max-height: 250px;
            object-fit: contain;
        }
        @media (max-width: 768px) {
            .main-box{
                flex-direction: column;
                height: auto;
            }
            .upload-side{
                border-right: none;
                border-bottom: 2px solid #504134;
                padding: 40px 20px;
            }
            .result-side{
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <h1>寻找图源</h1>
    <div class="main-box">
        <div class="upload-side">
            <img id="user-img" src="" alt="用户图片" style="display: none;">
            <input type="file" id="file-up" style="display: none;">
            <label for="file-up" class="img-label">
                <img src="shangchuan.png" alt="上传图片" class="upload-icon">
                <p>点击上传图片</p>
            </label>
        </div>
        <div class="result-side">
            <p>等待输出</p>
        </div>
    </div>
    <script>
        const fileInput = document.getElementById('file-up');
        const userImg = document.getElementById('user-img');
        const resultText = document.querySelector('.result-side p');

        fileInput.addEventListener('change', async function (event) {
            const file = event.target.files[0];
            if (!file) return;

            userImg.src = URL.createObjectURL(file);
            userImg.style.display = 'block';
            resultText.innerText = '正在寻找图源...';

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('http://localhost:3000/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                console.log('后端返回:', data);

                if (data.success) {
                    if (data.results && data.results.length > 0) {
                        const listItems = data.results.map(item => `
                            <li style="margin-bottom: 10px; text-align: left;">
                                <a href="${item.url}" target="_blank" rel="noopener noreferrer" style="color: #d2691e; font-weight: bold;">${item.title}</a>
                                <br>
                                <span style="font-size: 12px; color: #666;">
                                    相似度: ${item.similarity} | 作者: ${item.author}
                                </span>
                            </li>
                        `).join('');

                        resultText.innerHTML = `
                            <p style="color: green; font-weight: bold; margin-bottom: 15px;">✅ ${data.message}</p>
                            <ul style="padding-left: 20px; overflow-y: auto; max-height: 400px;">
                                ${listItems}
                            </ul>
                        `;
                    } else {
                        resultText.innerText = '😢 没找到相似结果，换张图试试？';
                    }
                } else {
                    resultText.innerText = data.message || '😢 搜索失败';
                }
            } catch (error) {
                console.error('上传失败:', error);
                resultText.innerText = '😢 请求失败，请检查后端服务是否启动';
            }
        });
    </script>
</body>
</html>
